<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн-библиотека — Вход</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">📚 БиблиоТека</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="catalog.html" class="nav__link">Каталог</a>
      </nav>
      <button class="burger" id="burger" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="section auth-section">
      <div class="container">
        <div class="auth-card">
          <div class="auth-tabs">
            <a href="auth.html"><button class="auth-tab auth-tab--active" data-tab="login">Вход</button></a>
            <a href="reg.html"><button class="auth-tab" data-tab="register">Регистрация</button></a>
          </div>

          <!-- Вход -->
          <div class="form" id="loginForm" hidden>
            <h2 class="form__title">Вход в аккаунт</h2>

            <div class="form__alert" id="loginAlert" role="alert" hidden></div>

            <label class="form__field">
              <span>Email <b class="req">*</b></span>
              <input type="email" id="loginEmail" placeholder="you@example.com">
              <small class="form__error"></small>
            </label>

            <label class="form__field">
              <span>Пароль <b class="req">*</b></span>
              <input type="password" id="loginPassword" placeholder="••••••••">
              <small class="form__error"></small>
            </label>

            <button type="button" class="btn btn--primary btn--full" id="loginBtn">Войти</button>
            <p class="form__hint">Нет аккаунта? <a href="#" data-switch="register">Зарегистрируйтесь</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>© 2025 БиблиоТека. Все права защищены.</p>
      <p>Сделано с ❤ для любителей чтения</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
